<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Daybook Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: quiet planner. Flat sidebar (profile, lists, projects, mini month) beside one open page.
   Today = day ticker on top, a duration-scaled timeline on the left, due tasks and projects on the right.
   Borders are structure (1px hairlines); shadows only on things that float (menus, dialogs, toasts). */
:root{
  --bg:#FFFFFF; --side:#F7F7F5; --surface:#FFFFFF; --field:rgba(15,17,20,.04);
  --ink:#1E1F22; --ink-2:#45474C; --muted:#76787D; --faint:#A7A9AD;
  --line:rgba(15,17,20,.09); --line-2:rgba(15,17,20,.15); --hover:rgba(15,17,20,.04); --press:rgba(15,17,20,.07);
  --red:#E5484D; --teal:#12A594; --amber:#E39B12; --danger:#D93B3B; --ok:#2A9D61;
  --acc-l:#1F5FBF; --acc-d:#7DB0FA; --onacc-l:#FFFFFF; --onacc-d:#0A1A30;
  --accent:var(--acc-l); --on-accent:var(--onacc-l);
  --pop:0 0 0 1px rgba(15,17,20,.07),0 4px 12px rgba(15,17,20,.10),0 16px 40px -12px rgba(15,17,20,.18);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r1:4px; --r2:6px; --r3:10px;
  --row:34px; --gutter:48px; --ppm:.9px; --hour:48px;
  --ease:cubic-bezier(.25,.8,.25,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181C; --side:#1C1E23; --surface:#22242A; --field:rgba(255,255,255,.05);
  --ink:#E6E7EA; --ink-2:#C4C6CB; --muted:#989BA2; --faint:#62656D;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13); --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --red:#FF6B70; --teal:#3CC6B0; --amber:#F2B544; --danger:#FF7A72; --ok:#5ACB8B;
  --accent:var(--acc-d); --on-accent:var(--onacc-d);
  --pop:0 0 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.45),0 24px 60px -16px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181C; --side:#1C1E23; --surface:#22242A; --field:rgba(255,255,255,.05);
  --ink:#E6E7EA; --ink-2:#C4C6CB; --muted:#989BA2; --faint:#62656D;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13); --hover:rgba(255,255,255,.045); --press:rgba(255,255,255,.08);
  --red:#FF6B70; --teal:#3CC6B0; --amber:#F2B544; --danger:#FF7A72; --ok:#5ACB8B;
  --accent:var(--acc-d); --on-accent:var(--onacc-d);
  --pop:0 0 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.45),0 24px 60px -16px rgba(0,0,0,.6);
  color-scheme:dark}
:root{
  --accent-soft:color-mix(in oklab,var(--accent) 12%,var(--bg));
  --accent-ink:color-mix(in oklab,var(--accent) 80%,var(--ink));
}
body.contrast-high{--muted:color-mix(in oklab,var(--ink) 78%,var(--bg));--faint:color-mix(in oklab,var(--ink) 58%,var(--bg));--line:color-mix(in oklab,var(--ink) 18%,transparent);--line-2:color-mix(in oklab,var(--ink) 30%,transparent)}
body.density-compact{--row:28px;--gutter:32px;--ppm:.7px;--hour:40px;font-size:13.5px}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit;transition:background-color .12s var(--ease),color .12s var(--ease),box-shadow .12s var(--ease),opacity .12s}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r2)}
::selection{background:color-mix(in oklab,var(--accent) 25%,transparent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{margin:0;font-weight:650;color:var(--ink)}
svg{flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;gap:18px;padding:12px 10px 14px max(10px,env(safe-area-inset-left,0px));background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.rail .brand{display:none}
.rail .nav{order:1}#rail-upcoming{order:2;display:flex;flex-direction:column;gap:14px}.rail .mini{order:3}
.account{order:-1;display:flex;align-items:center;gap:9px;height:36px;padding:0 8px;border-radius:var(--r2);width:100%;font-weight:600;font-size:14px}
.account:hover{background:var(--hover)}
.account .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.account .where{display:none}
.account .chev{color:var(--faint);width:14px;height:14px}
.account .linkish{font-size:12px;font-weight:500;color:var(--muted)}
.avatar{border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-weight:700;overflow:hidden;background:var(--accent);color:var(--on-accent)}
.avatar.s{width:22px;height:22px;font-size:10px}
.avatar.l{width:40px;height:40px;font-size:15px}
.avatar.xl{width:64px;height:64px;font-size:22px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{display:flex;align-items:center;gap:10px;height:var(--row);padding:0 8px;border-radius:var(--r2);font-weight:500;color:var(--ink-2)}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--press);color:var(--ink);font-weight:600}
.nav button .ic{width:18px;height:18px;display:grid;place-items:center}
.nav button .ic svg{width:17px;height:17px}
.nav button .ct{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.ic-earn{color:var(--amber)}.ic-today{color:var(--accent)}.ic-cal{color:var(--red)}.ic-proj{color:var(--teal)}.ic-set{color:var(--muted)}
.side-sec{display:flex;flex-direction:column;gap:1px}
.side-h{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.side-h button{width:22px;height:22px;border-radius:var(--r1);display:grid;place-items:center;color:var(--faint);opacity:0}
.side-sec:hover .side-h button,.side-h button:focus-visible{opacity:1}
.side-h button:hover{background:var(--hover);color:var(--ink)}
.side-h svg{width:14px;height:14px}
.side-item{display:flex;align-items:center;gap:10px;height:var(--row);padding:0 8px;border-radius:var(--r2);color:var(--ink-2);font-size:14px;width:100%;min-width:0}
.side-item:hover{background:var(--hover);color:var(--ink)}
.side-item[aria-current="true"]{background:var(--press);color:var(--ink);font-weight:600}
.side-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.side-item .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.pie{color:var(--accent)}
.pie .o{fill:none;stroke:currentColor;stroke-width:1.4}
.pie .w{fill:currentColor}
.mini{margin-top:auto;padding:10px 6px 2px;border-top:1px solid var(--line);font-size:12px}
.mini .rail-label{display:none}
.mini-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px;font-weight:600;font-size:12.5px}
.mini-head button{width:22px;height:22px;border-radius:var(--r1);color:var(--muted);display:inline-grid;place-items:center}
.mini-head button:hover{background:var(--hover);color:var(--ink)}
.mini-head svg{width:13px;height:13px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:1px}
.mini-grid .dow{color:var(--faint);font-size:10.5px;padding:2px 0 3px;font-weight:500}
.mini-grid button{height:24px;border-radius:50%;width:24px;justify-self:center;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);position:relative}
.mini-grid button:hover{background:var(--hover)}
.mini-grid button.out{color:var(--faint)}
.mini-grid button.today{background:var(--accent);color:var(--on-accent);font-weight:500}
.mini-grid button.sel:not(.today){background:var(--press)}
.mini-grid button.has:not(.today)::after{content:"";position:absolute;bottom:1px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--faint)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:40px max(var(--gutter),env(safe-area-inset-right,0px)) 22px var(--gutter)}
.page-title{font-family:var(--f-display);font-size:40px;line-height:1;font-weight:700;letter-spacing:-.025em;font-variation-settings:"opsz" 96;text-wrap:balance}
.page-title.nowrap,.page-title .soft{white-space:nowrap}
.page-title .soft{color:var(--faint);font-weight:600}
.greet{color:var(--muted);font-size:14.5px;margin:0 0 8px}
.greet b{color:var(--ink);font-weight:600}
.day-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;color:var(--muted);font-size:13.5px}
.day-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.day-meta b{color:var(--ink);font-weight:600}
.day-meta .warn{color:var(--danger)}
.focus-line{display:inline-flex;align-items:center;gap:6px;color:var(--muted);border-radius:var(--r1);padding:1px 4px;margin:-1px -4px;max-width:100%}
.focus-line:hover{background:var(--hover);color:var(--ink)}
.focus-line.set{color:var(--ink)}
.focus-line .lbl{color:var(--accent-ink);font-weight:600}
.focus-line .ft{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus-line svg{width:13px;height:13px;color:var(--accent)}
.focus-inp{height:28px;min-width:min(320px,100%);border:0;border-bottom:1.5px solid var(--accent);background:transparent;padding:0 2px;font-size:13.5px}
.focus-inp:focus{outline:none}
.grow{flex:1;min-width:0}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.view{flex:1;min-height:0;overflow:auto;padding:0 max(var(--gutter),env(safe-area-inset-right,0px)) 72px var(--gutter)}
.view.enter>*{animation:enter .18s var(--ease) both}
@keyframes enter{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r2);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in oklab,var(--accent) 90%,var(--ink))}
.btn-primary:active{background:color-mix(in oklab,var(--accent) 80%,var(--ink))}
.btn-ghost{box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink)}
.btn-ghost:hover{background:var(--hover)}
.btn-ghost:active{background:var(--press)}
.btn-danger{color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--danger) 35%,transparent)}
.btn-danger:hover{background:color-mix(in oklab,var(--danger) 8%,transparent)}
.btn-danger.armed{background:var(--danger);color:#FFFFFF;box-shadow:none}
.icon-btn{width:32px;height:32px;border-radius:var(--r2);display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn:active{background:var(--press)}
.icon-btn svg{width:17px;height:17px}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--field);gap:0}
.seg button{white-space:nowrap;height:26px;padding:0 11px;border-radius:5px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.06)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{--c:var(--accent);display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip:hover{background:var(--hover)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.banner{display:flex;gap:10px;align-items:center;margin:0 0 24px;padding:9px 12px;border-radius:var(--r2);background:var(--field);font-size:13px;color:var(--muted)}
.banner svg{width:15px;height:15px;color:var(--muted)}

/* ---------- today board ---------- */
.board{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);column-gap:56px;row-gap:40px;align-items:start;grid-auto-flow:row dense;max-width:1180px}
.w{min-width:0}
.w-week{grid-column:1/-1}
.w-schedule{grid-column:1;grid-row:span 2}
.w-due,.w-focus{grid-column:2}
.sec-h{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:15px;font-weight:650;letter-spacing:-.005em}
.sec-h .meta{font-size:12.5px;color:var(--faint)}
.sec-h .link{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:var(--r1);padding:1px 4px}
.sec-h .link:hover{color:var(--ink);background:var(--hover)}
.quiet{color:var(--muted);font-size:14px;padding:14px 0}

/* day ticker */
.ticker{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tk{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px 12px;min-width:0;border-right:1px solid var(--line)}
.tk:last-child{border-right:0}
.tk:hover{background:var(--hover)}
.tk-top{display:flex;align-items:baseline;gap:7px}
.tk-d{font-size:12px;color:var(--muted);font-weight:500}
.tk-n{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:28px;letter-spacing:-.02em;min-width:28px;height:28px;display:inline-grid;place-items:center;border-radius:50%;margin-left:-4px}
.tk.today .tk-n{background:var(--accent);color:var(--on-accent);font-size:16px}
.tk.today .tk-d{color:var(--accent-ink);font-weight:600}
.tk.past .tk-n,.tk.past .tk-d{color:var(--faint)}
.tk-bars{display:flex;gap:2px;height:4px;width:100%;overflow:hidden}
.tk-bars i{height:4px;border-radius:2px;background:var(--c);flex:0 1 14px;min-width:4px}
.tk.past .tk-bars i{opacity:.4}
.tk-c{font-size:11.5px;color:var(--faint)}

/* timeline */
.tl{list-style:none;margin:0;padding:6px 0 0;position:relative}
.tl li{display:grid;grid-template-columns:62px 22px minmax(0,1fr);position:relative;min-height:30px}
.tl li::before{content:"";position:absolute;left:72px;top:0;bottom:0;width:0;border-left:1.5px solid var(--line-2)}
.tl li:first-child::before{top:14px}
.tl li:last-child::before{bottom:calc(100% - 14px)}
.tl-time{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);padding-top:7px;line-height:1.3}
.tl-time small{display:block;color:var(--faint);font-size:11px}
.tl-node{position:relative;z-index:1;justify-self:center;margin-top:9px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.tl-ev .tl-body{display:flex;flex-direction:column;gap:2px;align-self:stretch;padding:5px 8px 10px;margin-left:2px;border-radius:var(--r2);min-height:calc(var(--h,30) * var(--ppm));text-align:left}
.tl-ev .tl-body:hover{background:var(--hover)}
.tl-ev b{font-weight:600;font-size:15px;line-height:1.3}
.tl-ev .m{font-size:13px;color:var(--muted)}
.tl-ev.past .tl-node{background:var(--bg);box-shadow:0 0 0 3px var(--bg),inset 0 0 0 1.5px var(--faint)}
.tl-ev.past b{color:var(--faint);font-weight:500}
.tl-ev.past .m,.tl-ev.past .tl-time{color:var(--faint)}
.tl-ev.live .tl-node{box-shadow:0 0 0 3px var(--bg),0 0 0 5px color-mix(in oklab,var(--c) 35%,transparent)}
.tl-ev.live .tl-time{color:var(--ink);font-weight:500}
.tl-dur{display:inline-block;width:3px;border-radius:2px;background:color-mix(in oklab,var(--c) 45%,transparent);position:absolute;left:71px;top:22px;bottom:6px;z-index:0}
.tl-gap{color:var(--faint);font-size:12.5px}
.tl-gap::before{border-left-style:dashed!important}
.tl-gap span:last-child{padding:6px 10px 8px}
.tl-now .tl-time{color:var(--red);font-weight:500}
.tl-now .tl-node{width:9px;height:9px;margin-top:10px;background:var(--red)}
.tl-now .lbl{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--red);font-size:12.5px;font-weight:600}
.tl-now .lbl::after{content:"";flex:1;height:1px;background:color-mix(in oklab,var(--red) 40%,transparent)}
.tl-sep{display:block!important;padding:18px 0 4px 84px;font-size:12.5px;font-weight:600;color:var(--muted)}
.tl-sep::before{display:none}
.allday{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0 4px 84px}
.upnext{margin-top:28px}
.up-day{display:grid;grid-template-columns:62px minmax(0,1fr);gap:0 22px;padding:10px 0;border-top:1px solid var(--line)}
.upnext .sec-h+.up-day{border-top:0}
.up-date{line-height:1.1}
.up-date b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.up-date span{font-size:12px;color:var(--muted)}
.up-list{display:flex;flex-direction:column}
.up-ev{--c:var(--accent);display:grid;grid-template-columns:60px 8px minmax(0,1fr);gap:10px;align-items:baseline;padding:4px 6px;border-radius:var(--r1);font-size:13.5px;text-align:left}
.up-ev:hover{background:var(--hover)}
.up-ev .t{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.up-ev i{width:7px;height:7px;border-radius:50%;background:var(--c);align-self:center}
.up-ev span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tasks */
.tasks{display:flex;flex-direction:column}
.task-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:11px;align-items:start;padding:7px 6px;border-radius:var(--r2)}
.task-row:hover{background:var(--hover)}
.check{width:17px;height:17px;margin-top:1.5px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--line-2);display:grid;place-items:center;color:var(--on-accent);background:var(--bg)}
.check:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.check svg{width:11px;height:11px;opacity:0;transform:scale(.5);transition:transform .18s var(--ease),opacity .12s}
.task-row.done .check{background:var(--accent);box-shadow:none}
.task-row.done .check svg{opacity:1;transform:none}
.task-row.pop .check{animation:tick .26s var(--ease)}
@keyframes tick{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:none}}
.tt{overflow-wrap:anywhere;transition:color .3s}
.task-row.done .tt{color:var(--faint);text-decoration:line-through;text-decoration-color:color-mix(in oklab,var(--faint) 70%,transparent)}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:2px;font-size:12.5px;color:var(--muted)}
.tag,.ptag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;color:var(--accent-ink);border-radius:var(--r1)}
.tag:hover,.ptag:hover{text-decoration:underline;text-underline-offset:2px}
.tag i{display:none}
.task-side{display:flex;align-items:center;gap:2px;padding-top:1px}
.due{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;color:var(--muted)}
.due svg{width:12px;height:12px}
.due.late{color:var(--danger)}
.due.soon{color:var(--accent-ink)}
.row-actions{display:flex;opacity:0;transition:opacity .12s}
.task-row:hover .row-actions,.row-actions:focus-within,.cat-edit .row-actions{opacity:1}
.row-actions button{width:26px;height:26px;border-radius:var(--r1);display:grid;place-items:center;color:var(--faint)}
.row-actions button:hover{color:var(--ink);background:var(--hover)}
.row-actions svg{width:14px;height:14px}

/* projects in motion rows */
.prow{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:11px;align-items:start;padding:8px 6px;border-radius:var(--r2);width:100%;text-align:left}
.prow:hover{background:var(--hover)}
.prow .pie{margin-top:2px}
.prow .pn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.prow .px{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}

/* ---------- calendar ---------- */
.cal-wrap{max-width:none}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.month .dow{padding:8px 8px 6px;font-size:12px;font-weight:500;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{min-height:118px;padding:5px 5px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.cell:hover{background:color-mix(in oklab,var(--ink) 2%,transparent)}
.cell.out{background:var(--side)}
.cell.out .dn{color:var(--faint)}
.dn{align-self:flex-start;font-family:var(--f-mono);font-size:12px;min-width:22px;height:22px;padding:0 5px;display:grid;place-items:center;border-radius:11px;color:var(--ink-2);margin-bottom:2px}
.cell.today .dn{background:var(--accent);color:var(--on-accent);font-weight:500}
.pill{--c:var(--accent);display:flex;align-items:center;gap:5px;font-size:12px;line-height:1.3;padding:2px 6px;border-radius:var(--r1);background:color-mix(in oklab,var(--c) 15%,var(--bg));color:color-mix(in oklab,var(--c) 50%,var(--ink));white-space:nowrap;overflow:hidden;min-width:0;font-weight:500;text-align:left}
.pill:hover{background:color-mix(in oklab,var(--c) 24%,var(--bg))}
.pill .t{font-family:var(--f-mono);font-size:10.5px;opacity:.75;flex:none;font-weight:400}
.pill span.n{overflow:hidden;text-overflow:ellipsis}
.pill.task{background:transparent;color:var(--ink-2)}
.pill.task:hover{background:var(--hover)}
.pill.task .t{width:9px;height:9px;border-radius:3px;box-shadow:inset 0 0 0 1.2px var(--muted);font-size:0;opacity:1}
.pill.done span.n{text-decoration:line-through;color:var(--faint)}
.pill.done .t{background:var(--accent);box-shadow:none}
.more{font-size:11.5px;color:var(--muted);padding-left:6px;font-weight:500}
.dots{display:none;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.tg-wrap{overflow:auto;max-height:calc(100% - 52px);border-top:1px solid var(--line)}
.tg{display:grid;min-width:0;position:relative}
.tg.week{min-width:760px}
.tg-head{display:contents}
.tg-head .h{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 8px 8px;text-align:left;display:flex;align-items:baseline;gap:6px}
.tg-head .h .d{font-size:12px;color:var(--muted);font-weight:500}
.tg-head .h .n{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em;min-width:28px;height:28px;display:inline-grid;place-items:center;border-radius:50%}
.tg-head button.h:hover .n{background:var(--hover)}
.tg-head .h.today .n{background:var(--accent);color:var(--on-accent);font-size:15px}
.tg-head .h.today .d{color:var(--accent-ink);font-weight:600}
.tg-allday{display:contents}
.tg-allday>div{border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-height:30px;min-width:0;border-left:1px solid var(--line)}
.tg-allday .lbl{font-size:11px;color:var(--faint);align-items:flex-end;justify-content:center;padding-right:8px;border-left:0}
.hours div{height:var(--hour,48px);font-family:var(--f-mono);font-size:10.5px;color:var(--faint);text-align:right;padding-right:8px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour,48px));min-width:0}
.ev{--c:var(--accent);position:absolute;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;border-radius:var(--r1);padding:4px 7px;font-size:12px;line-height:1.3;overflow:hidden;text-align:left;background:color-mix(in oklab,var(--c) 17%,var(--bg));color:color-mix(in oklab,var(--c) 45%,var(--ink));box-shadow:0 0 0 1px var(--bg)}
.ev:hover{background:color-mix(in oklab,var(--c) 26%,var(--bg));z-index:2}
.ev b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t{font-family:var(--f-mono);font-size:10.5px;opacity:.8}
.now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--red);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ---------- projects ---------- */
.project{max-width:760px}
.pj-head{display:flex;align-items:center;gap:14px}
.pj-head .pie{width:30px;height:30px}
.pj-title{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.022em;line-height:1.1;font-variation-settings:"opsz" 96}
.pj-note{color:var(--muted);max-width:62ch;margin:10px 0 0 44px;font-size:14.5px;white-space:pre-wrap}
.pj-meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:14px 0 0 44px;font-size:13px;color:var(--muted)}
.pj-meta .flag{display:inline-flex;align-items:center;gap:5px}
.pj-meta .flag svg{width:13px;height:13px}
.pj-meta .late{color:var(--danger)}
.progress{height:3px;border-radius:2px;background:var(--line);margin:18px 0 22px 44px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .4s var(--ease)}
.pj-body{margin-left:38px}
.add-row{display:grid;grid-template-columns:18px minmax(0,1fr) 150px auto;gap:11px;align-items:center;padding:6px;margin-top:4px;border-radius:var(--r2)}
.add-row:focus-within{background:var(--field)}
.add-row .plus{width:17px;height:17px;color:var(--accent);display:grid;place-items:center}
.add-row .plus svg{width:15px;height:15px}
.add-row input[type=text]{border:0;background:transparent;height:28px;padding:0;min-width:0}
.add-row input[type=text]:focus{outline:none}
.add-row input[type=date]{height:28px;border:0;background:transparent;color:var(--muted);font-size:12.5px;min-width:0}
.add-row .btn{height:28px;padding:0 10px;font-size:12.5px}
.show-done{display:inline-flex;align-items:center;gap:6px;margin:18px 0 6px 6px;font-size:12.5px;font-weight:600;color:var(--muted);border-radius:var(--r1);padding:2px 4px}
.show-done:hover{color:var(--ink);background:var(--hover)}
.show-done svg{width:12px;height:12px;transition:transform .15s var(--ease)}
.show-done[aria-expanded="true"] svg{transform:rotate(90deg)}
.proj-index{max-width:760px}
.back{display:none}

/* ---------- forms & dialogs ---------- */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:500;color:var(--muted)}
.inp{height:34px;padding:0 10px;border-radius:var(--r2);border:1px solid transparent;background:var(--field);width:100%;min-width:0;transition:border-color .12s,box-shadow .12s,background-color .12s}
.inp:hover{border-color:var(--line)}
textarea.inp{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.inp:focus{outline:none;background:var(--bg);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 20%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.cat-pick{display:flex;flex-wrap:wrap;gap:6px}
.cat-pick .chip[aria-pressed="true"]{background:color-mix(in oklab,var(--c) 14%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--c) 45%,transparent);color:var(--ink)}
.cat-pick .chip[aria-pressed="false"]{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.cat-pick .chip[aria-pressed="false"] i{background:var(--c);box-shadow:none}
.toggle{position:relative;width:34px;height:20px;border-radius:999px;background:var(--line-2);flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s var(--ease)}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(14px)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.28);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fade .12s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--surface);border-radius:var(--r3);box-shadow:var(--pop);padding:22px 24px;display:flex;flex-direction:column;gap:16px;animation:modal .16s var(--ease)}
@keyframes modal{from{opacity:.001;transform:scale(.985) translateY(4px)}to{opacity:1;transform:none}}
.modal h2{font-size:17px}
.modal-foot{display:flex;gap:8px;align-items:center;margin:4px -24px -22px;padding:12px 24px;border-top:1px solid var(--line)}
.title-inp{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em;border:0;background:transparent;padding:0;width:100%}
.title-inp::placeholder{color:var(--faint)}
.title-inp:focus{outline:none}
.danger{color:var(--danger)}
.modal .agenda{display:flex;flex-direction:column}
.ag{--c:var(--accent);display:grid;grid-template-columns:60px 8px minmax(0,1fr);gap:12px;align-items:baseline;padding:6px;border-radius:var(--r2);text-align:left;width:100%}
.ag:hover{background:var(--hover)}
.ag .tm{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.ag .tm small{display:none}
.ag .sw{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.ag .ti{font-weight:600}
.ag .meta{font-size:12.5px;color:var(--muted)}
.ag.past{opacity:.5}
.group-h{font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 6px 2px}

/* ---------- settings ---------- */
.settings{display:flex;flex-direction:column;gap:34px;max-width:720px}
.set-h{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px 2px}
.set-list{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.set-row{display:flex;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;min-height:52px}
.set-row:first-child{border-top:0}
.set-row .lbl{flex:1;min-width:180px}
.set-row .lbl b{display:block;font-weight:600;font-size:14px}
.set-row .lbl small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.set-row.stack{display:block}
.set-row.stack .lbl{margin-bottom:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw-btn{width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sw-btn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--c)}
.palettes{display:flex;flex-wrap:wrap;gap:4px 6px}
.pal{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;padding:8px 4px;border-radius:var(--r2);font-size:12px;font-weight:500;color:var(--muted);text-align:center;position:relative}
.pal:hover{background:var(--hover);color:var(--ink)}
.pal .sw{width:28px;height:28px;border-radius:50%;background:var(--pc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pal[aria-pressed="true"],.pal.on{color:var(--ink);font-weight:600}
.pal[aria-pressed="true"] .sw,.pal.on .sw{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc)}
.pal input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.pal .sw.custom{background:conic-gradient(#E5484D,#E39B12,#2A9D61,#12A594,#1F5FBF,#6844C2,#B3386A,#E5484D)}
input[type=color]{width:30px;height:26px;border:1px solid var(--line-2);border-radius:var(--r2);padding:2px;background:var(--surface);cursor:pointer}
.cat-edit{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0}
.font-opt{height:32px;padding:0 12px;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px}
.font-opt:hover{background:var(--hover)}
.font-opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft)}
.font-opt small{display:none}
.lay{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.lay:first-child{border-top:0}
.lay.off .nm{opacity:.5}
.lay .nm{flex:1;min-width:0}
.lay .nm b{display:block;font-weight:600;font-size:14px}
.lay .nm small{color:var(--muted);font-size:12.5px}
.lay .mv{display:flex;gap:2px}
.lay .mv button{width:26px;height:26px;border-radius:var(--r1);display:grid;place-items:center;color:var(--muted)}
.lay .mv button:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.lay .mv button:disabled{opacity:.3;cursor:default}
.lay .mv svg{width:14px;height:14px}
.profile-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r2);background:var(--field);font-size:13px;color:var(--ink-2);margin:0 16px 14px}
.note svg{width:15px;height:15px;color:var(--muted);margin-top:1px}
.disabled{opacity:.45;pointer-events:none}

/* ---------- misc ---------- */
.empty{max-width:440px;padding:40px 0;color:var(--muted)}
.empty h3{color:var(--ink);font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
.empty p{margin:0 0 18px}
.empty .actions{display:flex;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;max-width:100%;padding:9px 10px 9px 14px;border-radius:var(--r3);background:color-mix(in oklab,var(--ink) 94%,var(--bg));color:var(--bg);box-shadow:var(--pop);font-size:13px;animation:toast .18s var(--ease)}
.toast svg{width:16px;height:16px;display:block;color:var(--accent)}
.toast>div{min-width:0}
.toast b{font-weight:600;margin-right:6px}
.toast .tb{display:inline;opacity:.7}
.toast button{color:inherit;opacity:.6;font-size:12px;font-weight:600;padding:4px 6px;border-radius:var(--r1)}
.toast button:hover{opacity:1;background:rgba(127,127,127,.2)}
@keyframes toast{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fab,.tabbar{display:none}
#auth{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto;height:100%;background:var(--side)}
.auth-card{width:min(400px,100%);padding:32px;border-radius:var(--r3);background:var(--bg);box-shadow:var(--pop)}
.auth-card h1{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);position:relative}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;left:5px;height:2px;border-radius:1px;background:var(--on-accent)}
.brand-mark::before{top:7px;right:5px}.brand-mark::after{top:12px;right:9px;opacity:.6}
.linkish{color:var(--accent-ink);font-weight:600}
.linkish:hover{text-decoration:underline;text-underline-offset:2px}
.sheet{background:transparent}
.pill.deadline{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--danger) 40%,transparent);font-weight:600}
.pill.deadline:hover{background:color-mix(in oklab,var(--danger) 8%,transparent)}
.pill.deadline svg{width:11px;height:11px}
.tk-due{display:inline-flex;align-items:center;gap:4px;color:var(--danger);font-weight:600;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tk-due svg{width:11px;height:11px}
.up-due{color:var(--danger);font-weight:600}.up-due .t{color:var(--danger)}.up-due i{border-radius:1px;background:var(--danger)}
.ag-due .tm,.ag-due .ti{color:var(--danger)}.ag-due .sw{border-radius:1px;background:var(--danger)}
.custom-cat{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r2);background:var(--field)}
.row-custom{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;align-items:center}
.custom-cat .inp{background:var(--bg)}
.keep{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
@media (max-width:860px){.tk-due{font-size:0;gap:0}.tk-c:has(.tk-due){display:block}.tk-due svg{width:12px;height:12px}}

/* earnings */
.pay-setup{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;margin:0 0 28px;border-radius:var(--r3);background:var(--accent-soft)}
.pay-setup b{display:block;font-weight:600}
.pay-setup small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.pay-setup .per{font-size:13px;color:var(--muted)}
.money{display:inline-flex;align-items:center;height:32px;border-radius:var(--r2);background:var(--field);border:1px solid transparent;padding:0 8px;gap:3px;width:116px;transition:border-color .12s,box-shadow .12s,background-color .12s}
.money:hover{border-color:var(--line)}
.money:focus-within{background:var(--bg);border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 20%,transparent)}
.money .cur{color:var(--faint);font-size:13px;flex:none}
.money input{border:0;background:transparent;width:100%;min-width:0;height:100%;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;padding:0;text-align:right}
.money input:focus{outline:none}
.money input::placeholder{color:var(--faint);font-family:var(--f-body)}
.money input::-webkit-inner-spin-button,.money input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.money input{-moz-appearance:textfield}
.pay-setup .money{background:var(--bg)}
.ledger{max-width:980px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ledger-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.ledger-k{width:100%;font-size:13px;color:var(--muted);font-weight:500}
.ledger-v{font-family:var(--f-display);font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.ledger-proj{font-size:13.5px;color:var(--muted)}
.ledger-parts{display:flex;flex-wrap:wrap;gap:12px 0;margin:18px 0 0}
.ledger-parts>div{padding:0 26px 0 0;margin:0 26px 0 0;border-right:1px solid var(--line)}
.ledger-parts>div:last-child{border-right:0}
.ledger-parts dt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ledger-parts dd{margin:2px 0 0;font-size:17px;font-weight:500;color:var(--ink)}
.ledger-note{display:flex;gap:8px;align-items:flex-start;margin:16px 0 0;font-size:13px;color:var(--muted)}
.ledger-note svg{width:15px;height:15px;margin-top:1px;color:var(--accent)}
.k-w,.k-t,.k-p{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
:root{--viz-w:#2a78d6;--viz-t:#eb6834}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--viz-w:#3987e5;--viz-t:#d95926}}
:root[data-theme="dark"]{--viz-w:#3987e5;--viz-t:#d95926}
.k-w{background:var(--viz-w)}.k-t{background:var(--viz-t)}.k-p{background:transparent;box-shadow:inset 0 0 0 1.5px var(--viz-w);background-image:repeating-linear-gradient(45deg,color-mix(in oklab,var(--viz-w) 45%,transparent) 0 1.5px,transparent 1.5px 4px)}
.earn-chart{margin:24px 0 8px;max-width:980px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart-box{position:relative}
.earn-chart svg{display:block;width:100%;height:auto;max-width:100%;overflow:visible}
.earn-chart .grid{stroke:var(--line);stroke-width:1}
.earn-chart .base{stroke:var(--line-2);stroke-width:1}
.earn-chart .yl{font-family:var(--f-mono);font-size:10.5px;fill:var(--faint);text-anchor:end}
.earn-chart .xl{font-size:11px;fill:var(--muted);text-anchor:middle;font-family:var(--f-body)}
.earn-chart .is-today .xl{fill:var(--ink);font-weight:600}
.earn-chart .hit{fill:transparent}
.earn-chart .col.hover .hit{fill:var(--hover)}
.earn-chart .m-w{fill:var(--viz-w)}
.earn-chart .m-t{fill:var(--viz-t)}
.earn-chart .m-p{fill:color-mix(in oklab,var(--viz-w) 14%,var(--bg));stroke:var(--viz-w);stroke-width:1.2;stroke-dasharray:3 2}
.chart-tip{position:absolute;z-index:5;pointer-events:none;min-width:150px;padding:8px 10px;border-radius:var(--r2);background:var(--surface);box-shadow:var(--pop);font-size:12.5px;color:var(--ink)}
.chart-tip b{display:block;font-weight:600}
.chart-tip .tn{display:block;color:var(--muted);margin-bottom:4px}
.chart-tip div{display:flex;align-items:center;gap:6px;margin-top:2px}
.chart-tip .num{margin-left:auto;padding-left:12px;font-family:var(--f-mono)}
.shifts{max-width:980px;margin-top:22px}
.shift-head,.shift{display:grid;grid-template-columns:44px minmax(0,1fr) 104px 128px 104px;gap:14px;align-items:center}
.shift-head{padding:0 6px 8px;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line)}
.shift-head span:first-child{grid-column:1/3}
.shift-head span:nth-child(n+2){text-align:right}
.shift-group{font-size:12.5px;font-weight:600;color:var(--muted);padding:18px 6px 6px}
.shift{padding:8px 6px;border-radius:var(--r2)}
.shift:hover{background:var(--hover)}
.sh-date{line-height:1.1;text-align:left}
.sh-date b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.sh-date span{font-size:11.5px;color:var(--muted)}
.sh-main{display:flex;flex-direction:column;min-width:0;text-align:left;border-left:3px solid var(--c);padding-left:10px}
.sh-t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-w,.sh-tot{text-align:right;font-family:var(--f-mono);font-size:13px}
.sh-tot{font-weight:500;color:var(--ink)}
.sh-tips{display:flex;justify-content:flex-end}
.sh-tips .na{color:var(--faint);padding-right:8px}
.shift.up .sh-w,.shift.up .sh-tot{color:var(--muted)}
.shift.up .sh-date b{color:var(--muted)}
.now-chip{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 7px;vertical-align:1px}
.w-earnings{grid-column:2}
.earn-w-sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 6px 4px}
.earn-w-sum .big{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.earn-w-sum .sm{font-size:13px;color:var(--muted)}
.tip-prompt{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:var(--r2)}
.tip-prompt:hover{background:var(--hover)}
.tip-prompt .q{flex:1;min-width:0;font-size:14px}
.tip-prompt .q small{display:block;color:var(--muted);font-size:12.5px}
.pay-block{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--r2);background:var(--field)}
.pay-block .money{background:var(--bg);width:100%}
.pay-block .hint{font-size:12.5px;color:var(--muted)}
.pay-block .row-pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-block .row-pay .inp{background:var(--bg)}
@media (max-width:1100px){.w-earnings{grid-column:1}}
@media (max-width:860px){
  .ledger-v{font-size:40px}
  .ledger-parts>div{padding-right:16px;margin-right:16px}
  .ledger-parts dd{font-size:15px}
  .shift-head{display:none}
  .shift{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"d m m" "d w tips" "d tot tot";row-gap:6px;padding:12px 4px;border-top:1px solid var(--line);border-radius:0}
  .sh-date{grid-area:d;align-self:start}.sh-main{grid-area:m}
  .sh-w{grid-area:w;text-align:left}.sh-tips{grid-area:tips}.sh-tot{grid-area:tot;text-align:left}
  .sh-w::before,.sh-tot::before{content:attr(data-lbl) " ";font-family:var(--f-body);color:var(--muted);font-size:12px;margin-right:4px}
  .sh-tot{font-weight:600}
  .tabbar button{font-size:10px}
}

/* project sections + timeline tasks */
.pj-sec{margin-top:26px}
.pj-sec:first-child{margin-top:4px}
.pj-sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 6px 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.pj-sec-h h2{font-size:15px;font-weight:650}
.pj-sec-h .meta{font-size:12.5px;color:var(--faint)}
.pj-sec-h .btn{margin-left:auto}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.tl-task{padding:4px 0 10px;border-bottom:1px solid var(--line)}
.tl-task:last-child{border-bottom:0}
.tlt-head .tt{font-weight:600}
.tlt-title{display:block;min-width:0;text-align:left}
.tlt-title .tmeta{display:block}
.tl-task.done .tlt-title{cursor:pointer}
.tlt-head .due svg{width:12px;height:12px}
.steps{margin-left:29px;border-left:1.5px solid var(--line-2);padding-left:6px}
.task-row.step{padding:5px 6px}
.task-row.step .check{width:15px;height:15px;border-radius:50%;margin-top:2px}
.task-row.step .tt{font-size:14px}
.step-add{margin-top:0}
.step-add .btn{height:26px}
.mtl{margin:4px 6px 10px 35px}
.mtl-track{position:relative;height:22px}
.mtl-rail,.mtl-fill{position:absolute;left:0;top:10px;height:2px;border-radius:2px}
.mtl-rail{right:0;background:var(--line-2)}
.mtl-fill{background:var(--accent)}
.mtl.is-late .mtl-fill{background:var(--danger)}
.mtl.is-done .mtl-fill{width:100%!important;background:var(--ok)}
.mtl .tn{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}
.mtl .tn.done{background:var(--accent)}
.mtl .tn.late{box-shadow:inset 0 0 0 2px var(--danger)}
.mtl .tn.end{top:1px;width:20px;height:20px;margin-left:-10px;background:var(--bg);box-shadow:none;display:grid;place-items:center;color:var(--ink)}
.mtl.is-late .tn.end{color:var(--danger)}
.mtl .tn.end svg{width:14px;height:14px}
.mtl-today{position:absolute;top:-1px;width:0;height:24px;border-left:1.5px dashed var(--muted)}
.mtl-today span{position:absolute;bottom:100%;left:0;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;padding-bottom:1px}
.mtl{padding-top:12px}
.mtl-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:2px;font-family:var(--f-mono)}
.tmeta .par{color:var(--muted)}
/* earnings months table */
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 72px 104px 104px 110px;gap:14px;align-items:center}
.mhead{padding:0 6px 8px;font-size:12px;color:var(--faint);border-bottom:1px solid var(--line)}
.mhead span:nth-child(n+2){text-align:right}
.mrow{padding:10px 6px;border-radius:var(--r2);width:100%;text-align:left}
.mrow:hover{background:var(--hover)}
.mrow .mm b{font-weight:600}
.mrow .mm small{display:block;font-size:12px;color:var(--muted)}
.mrow .num{text-align:right;font-family:var(--f-mono);font-size:13px}
.mrow .tot{font-weight:500}
.mrow .tot.sched{color:var(--muted);font-weight:400}
.mrow .tot.sched::before{content:"expected ";font-family:var(--f-body);font-size:11.5px}
.mrow.cur .mm b::after{content:"now";margin-left:8px;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:1px 7px;vertical-align:1px}
@media (max-width:860px){
  .steps{margin-left:12px}
  .mtl{margin-left:18px}
  .mhead{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"m tot" "x x";row-gap:2px;border-top:1px solid var(--line);border-radius:0}
  .mrow .mm{grid-area:m}.mrow .tot{grid-area:tot}
  .mrow .n-s,.mrow .n-h,.mrow .n-w,.mrow .n-t{display:none}
  .mrow .mob{grid-area:x;display:block!important;font-size:12.5px;color:var(--muted)}
}
.mrow .mob{display:none}
.top-actions{flex-wrap:wrap;justify-content:flex-end}
.pay-title{flex:1 0 auto;max-width:100%}
@media (max-width:860px){
  .pay-actions{width:100%;margin-left:0;justify-content:flex-start}
  .pay-actions .seg{order:-1;width:100%}
  .pay-actions .seg button{flex:1;height:30px}
  .pay-actions>[data-quicktheme]{margin-left:auto}
}

/* classes + work sessions */
.cdot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);flex:none;vertical-align:0}
.cdot.lg{width:14px;height:14px;border-radius:4px;margin-top:3px}
.ic-class{color:var(--teal)}
.cl-swatch{width:30px;height:30px;border-radius:9px;background:var(--c);flex:none}
.klass .pj-meta{margin-top:8px}
.cl-next{display:flex;flex-wrap:wrap;gap:12px 0;margin:18px 0 22px 44px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cl-next>div{padding-right:28px;margin-right:28px;border-right:1px solid var(--line);min-width:0}
.cl-next>div:last-child{border-right:0;margin-right:0}
.cl-next dt{font-size:12px;color:var(--muted)}
.cl-next dd{margin:3px 0 0}
.cl-next dd b{display:block;font-weight:600;font-size:15px}
.cl-next dd b.none{color:var(--faint);font-weight:500}
.cl-next dd small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.tchip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;color:color-mix(in oklab,var(--c,var(--accent)) 60%,var(--ink));background:color-mix(in oklab,var(--c,var(--accent)) 14%,var(--bg));white-space:nowrap;vertical-align:1px}
.meet-row{display:grid;grid-template-columns:84px minmax(0,1fr) 130px minmax(0,1fr);gap:12px;align-items:center;padding:9px 6px;border-radius:var(--r2)}
.meet-row:hover{background:var(--hover)}
.meet-row .md{font-weight:600}
.meet-row .mt{font-family:var(--f-mono);font-size:13px}
.meet-row .mr{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 6px;border-radius:var(--r2)}
.test-row:hover{background:var(--hover)}
.test-row .tchip{justify-self:start}
.tr-main{min-width:0;text-align:left}
.tr-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-main small{display:block;font-size:12.5px;color:var(--muted)}
.test-row.past{opacity:.55}
.add-test{grid-template-columns:18px 112px minmax(0,1fr) 140px 104px auto}
.mini-sel{height:28px;border:0;background:var(--field);border-radius:var(--r1);padding:0 6px;font-size:13px}
.add-test input[type=time]{height:28px;border:0;background:transparent;color:var(--muted);font-size:12.5px;min-width:0}
.meets{display:flex;flex-direction:column;gap:8px}
.meet-edit{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:var(--r2);background:var(--field);box-shadow:inset 0 0 0 1px transparent}
.meet-edit.err{box-shadow:inset 0 0 0 1.5px var(--danger)}
.meet-edit .inp{background:var(--bg);height:32px}
.me-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.me-type{width:auto;min-width:110px}
.dows{display:flex;gap:3px;flex-wrap:wrap}
.dow-btn{width:32px;height:30px;border-radius:var(--r2);font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.dow-btn:hover{color:var(--ink)}
.dow-btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
.me-del{margin-left:auto;width:30px;height:30px}
.me-bot{display:grid;grid-template-columns:110px auto 110px minmax(0,1fr);gap:8px;align-items:center}
.me-bot .to{font-size:12.5px;color:var(--muted)}
.me-msg{color:var(--danger);font-size:12.5px;min-height:0}
.me-msg:empty{display:none}
.ev-for{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.ev-for i{width:10px;height:10px;border-radius:3px}
.sess-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:8px 6px;border-radius:var(--r2);width:100%;text-align:left}
.sess-row:hover{background:var(--hover)}
.sess-d{line-height:1.1}
.sess-d b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700}
.sess-d span{font-size:11.5px;color:var(--muted)}
.sess-m b{display:block;font-weight:600;font-family:var(--f-mono);font-size:13.5px}
.sess-m small{display:block;font-size:12.5px;color:var(--muted)}
@media (max-width:860px){
  .tabbar{grid-template-columns:repeat(6,1fr)!important}
  .tabbar button{font-size:9.5px}
  .tabbar svg{width:21px;height:21px}
  .cl-next{margin-left:0}
  .cl-next>div{padding-right:14px;margin-right:14px}
  .meet-row{grid-template-columns:76px minmax(0,1fr);row-gap:2px}
  .meet-row .mt{grid-column:2}
  .meet-row .mr{grid-column:2}
  .test-row{grid-template-columns:minmax(0,1fr) auto}
  .test-row .tchip{grid-column:1/-1}
  .add-row.add-test{grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) auto;row-gap:6px}
  .add-row.add-test .plus{grid-column:1;grid-row:1}
  .add-row.add-test select{grid-column:2/4;grid-row:1}
  .add-row.add-test .btn{grid-column:4;grid-row:1}
  .add-row.add-test input[name=ttitle]{grid-column:2/-1;grid-row:2}
  .add-row.add-test input[type=date]{grid-column:2;grid-row:3}
  .add-row.add-test input[type=time]{grid-column:3/-1;grid-row:3}
  .me-bot{grid-template-columns:1fr auto 1fr}
  .me-bot .me-room{grid-column:1/-1}
}

/* ===================== Calendar tab: organised layout ===================== */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:32px;height:calc(100% - 4px);min-height:520px}
.cal-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.cal-chips{display:none;margin-bottom:14px}
/* side panel */
.cal-side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding:4px 2px 24px 24px;border-left:1px solid var(--line)}
.cs-date{display:flex;flex-direction:column;gap:2px}
.cs-rel{font-size:12px;font-weight:600;color:var(--muted)}
.cs-rel.is-today{color:var(--accent-ink)}
.cs-big{font-family:var(--f-display);font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.cs-sub{font-size:13px;color:var(--muted)}
.cs-sum{font-size:13px;color:var(--muted);padding-bottom:4px}
.cs-sum b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:12.5px}
.cs-add{justify-content:flex-start;width:100%;flex:none}
.cs-due{flex:none;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:var(--r2);background:color-mix(in oklab,var(--danger) 9%,var(--bg));color:var(--danger);font-weight:600;font-size:13.5px;text-align:left}
.cs-due svg{width:14px;height:14px}
.cs-due span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-due small{font-weight:500;font-size:12px;opacity:.8}
.cs-list{display:flex;flex-direction:column;gap:2px}
.cs-ev{display:grid;grid-template-columns:56px 3px minmax(0,1fr);gap:10px;align-items:stretch;padding:8px 6px;border-radius:var(--r2);text-align:left}
.cs-ev:hover{background:var(--hover)}
.cs-ev i{border-radius:2px;background:var(--c)}
.cs-t{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);line-height:1.35;padding-top:1px}
.cs-t small{display:block;color:var(--faint);font-size:11px}
.cs-m{min-width:0;display:flex;flex-direction:column;gap:1px}
.cs-m b{font-weight:600;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-m small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cs-ev.is-past{opacity:.6}
.cs-empty{margin:4px 0;color:var(--muted);font-size:13.5px}
.cs-h{margin-top:10px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.cal-side .tasks .task-row{padding:6px 4px}
.cs-cals{display:flex;flex-direction:column;gap:1px}
.cs-cal{display:flex;align-items:center;gap:10px;height:30px;padding:0 6px;border-radius:var(--r2);font-size:13.5px;color:var(--ink-2);text-align:left}
.cs-cal:hover{background:var(--hover)}
.cs-cal i{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--c);color:var(--bg)}
.cs-cal i svg{width:10px;height:10px;opacity:0}
.cs-cal[aria-checked="true"] i{background:var(--c);box-shadow:none}
.cs-cal[aria-checked="true"] i svg{opacity:1}
.cs-cal[aria-checked="false"] span{color:var(--faint)}

/* month */
.month2{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--bg)}
.m2-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}

}
sb.auth.onAuthStateChange((ev, session) => {

});
let started = false;
async function startApp(session) {
  hideAuth();

  LS_KEY = "daybook.cache." + state.uid;
  state.me = { name: session.user.user_metadata?.name || session.user.email.split("@")[0], avatarUrl: "" };
  state.mode = "cloud";
  const cached = lsRead();
  if (cached) {
    state.events = new Map((cached.events || []).map(e => [e.id, e]));
    state.projects = new Map((cached.projects || []).map(p => [p.id, p]));
    state.classes = new Map((cached.classes || []).map(c => [c.id, c]));
    state.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), cached.settings || {});
    state.loaded = true;
  }

  applySettings(); render();
  await pull();
  sb.channel("daybook-" + state.uid)
    .on("postgres_changes", { event: "*", schema: "public", table: "events", filter: `user_id=eq.${state.uid}` }, () => pullSoon())
    .on("postgres_changes", { event: "*", schema: "public", table: "projects", filter: `user_id=eq.${state.uid}` }, () => pullSoon())
    .on("postgres_changes", { event: "*", schema: "public", table: "classes", filter: `user_id=eq.${state.uid}` }, () => pullSoon())
    .on("postgres_changes", { event: "*", schema: "public", table: "settings", filter: `user_id=eq.${state.uid}` }, () => pullSoon())
    .subscribe();
  if (!started) {
    started = true;
    setInterval(checkReminders, 20000); setTimeout(checkReminders, 1500);
    checkDevicePerm().then(scheduleNativeSoon); setInterval(scheduleNativeSoon, 15 * 60000);
    setInterval(() => { if (state.view !== "preferences") renderView(); }, 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pullSoon(); });
  }
}
let pullT; function pullSoon() { clearTimeout(pullT); pullT = setTimeout(pull, 400); }
async function pull() {
  try {
    const [ev, pj, st, cl] = await Promise.all([sb.from("events").select("id,data"), sb.from("projects").select("id,data"), sb.from("settings").select("data").eq("user_id", state.uid).maybeSingle(), sb.from("classes").select("id,data")]);
    if (ev.error || pj.error) throw ev.error || pj.error;
    state.events = new Map(ev.data.map(r => [r.id, { id: r.id, ...r.data }]));
    state.projects = new Map(pj.data.map(r => [r.id, { id: r.id, ...r.data }]));
    state.classes = new Map(((cl && !cl.error && cl.data) || []).map(r => [r.id, { id: r.id, ...r.data }]));
    if (st.data && st.data.data) { state.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), st.data.data); state.settings.notif = Object.assign({}, DEFAULT_SETTINGS.notif, st.data.data.notif || {}); }

}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-cellday],[data-scrim]"); if (!t) return;
  const d = t.dataset;
  if (d.scrim !== undefined && e.target === t) return closeModal();
  if (d.close !== undefined) return closeModal();
  if (d.go) return go(d.go);
  if (d.mini) { state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + Number(d.mini), 1); return render(); }
  if (d.day) { state.cursor = pd(d.day); state.calMode = "day"; return go("calendar"); }
  if (d.gotoday) { closeModal(); state.cursor = pd(d.gotoday); state.calMode = "day"; return go("calendar"); }
  if (d.nav !== undefined) {
    const n = Number(d.nav), c = state.cursor;
    if (n === 0) state.cursor = new Date();
    else if (state.calMode === "month") state.cursor = new Date(c.getFullYear(), c.getMonth() + n, 1);
    else state.cursor = addDays(c, n * (state.calMode === "week" ? 7 : 1));
    return render();
  }
  if (d.cal) { state.calMode = d.cal; return render(); }
  if (d.ev && d.ev.startsWith("test:")) { e.stopPropagation(); const [, cid, tid] = d.ev.split(":"), c = state.classes.get(cid); if (c && !state.readOnly) { closeModal(); testEditor(c, (c.tests || []).find(x => x.id === tid)); } return; }
  if (d.ev && state.events.get(d.ev)?.classId && state.classes.has(state.events.get(d.ev).classId)) { e.stopPropagation(); closeModal(); state.selClass = state.events.get(d.ev).classId; return go("classes"); }
  if (d.ev) { e.stopPropagation(); const ev = state.events.get(d.ev); if (ev && !state.readOnly) { closeModal(); eventEditor(ev, d.date); } return; }
  if (d.new) { if (state.readOnly) return; closeModal(); return d.new === "project" ? projectEditor() : d.new === "shift" ? eventEditor(null, d.newdate || todayStr(), payCats()[0] || "work") : eventEditor(null, d.newdate); }

  if (d.font) { S().font = d.font; return store.saveSettings(); }
  if (d.density) { S().density = d.density; return store.saveSettings(); }

document.addEventListener("keydown", e => {

});
document.addEventListener("change", e => {

      const m = Math.min(img.width, img.height), x = (img.width - m) / 2, y = (img.height - m) / 2;
      c.getContext("2d").drawImage(img, x, y, m, m, 0, 0, n, n); URL.revokeObjectURL(url);
      S().avatar = c.toDataURL("image/jpeg", .86); S().avatarMode = "auto"; store.saveSettings(); toast("Profile picture updated", "It shows on your Today screen and sidebar.");

    img.src = url; return;
  }
