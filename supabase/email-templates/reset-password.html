<div style="background:#EEF0EC;padding:28px 16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1B2029">
  <div style="max-width:480px;margin:0 auto">
    <div style="font-weight:800;font-size:18px;margin-bottom:16px">Daybook</div>
    <div style="background:#FBFBF9;border:1px solid #DCDFD9;border-radius:14px;padding:24px">
      <h1 style="font-size:21px;margin:0 0 10px">Reset your password</h1>
      <p style="margin:0 0 16px;color:#3E4450">Enter this code in Daybook, then choose a new password.</p>
      <div style="font-family:Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;background:#EEF0EC;border-radius:10px;padding:14px 0;text-align:center">{{ .Token }}</div>
      <p style="margin:16px 0 0;font-size:13px;color:#666D79">If you didn’t ask to reset your password, ignore this email. Your password stays the same.</p>
    </div>
  </div>
</div>
